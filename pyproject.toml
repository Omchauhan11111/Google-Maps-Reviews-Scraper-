[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "maps-review-extractor"
version = "1.0.0"
description = "Local bulk Google Maps review extraction workspace"
requires-python = ">=3.11"
dependencies = [
    "Flask==3.1.2",
    "openpyxl==3.1.5",
    "selenium==4.49.0",
    "waitress==3.0.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
